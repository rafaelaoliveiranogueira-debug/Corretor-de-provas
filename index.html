<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escola São Tomaz de Aquino - Corretor de Provas</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) para exportar planilhas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
            .page-container {
                page-break-after: always;
                height: 100vh;
                max-height: 100vh;
                box-sizing: border-box;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 4mm 5mm;
            }
            .page-container:last-child {
                page-break-after: avoid;
            }
        }
        .bubble {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .bubble.selected {
            background-color: #1f2937;
            color: white;
            border-color: #1f2937;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-p-4">

    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <!-- Cabeçalho Principal -->
        <header class="bg-indigo-600 text-white p-4 rounded-xl shadow-lg mb-6 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Escola São Tomaz de Aquino</h1>
                <p class="text-indigo-200 text-sm">Sistema de Correção de Provas & Gestão de Gabaritos</p>
            </div>
            <nav class="flex gap-2 mt-4 sm:mt-0 flex-wrap">
                <button onclick="switchTab('turmas')" class="tab-btn bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg font-medium text-sm transition">Salas & Alunos</button>
                <button onclick="switchTab('provas')" class="tab-btn bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg font-medium text-sm transition">Criar Provas</button>
                <button onclick="switchTab('imprimir')" class="tab-btn bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg font-medium text-sm transition">Imprimir Gabaritos</button>
                <button onclick="switchTab('scanner')" class="tab-btn bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg font-medium text-sm transition">Leitor / Scanner</button>
                <button onclick="switchTab('relatorios')" class="tab-btn bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg font-medium text-sm transition">Relatórios & Planilhas</button>
            </nav>
        </header>

        <!-- CONTEÚDO DAS ABAS -->
        <main>
            <!-- ABA 1: TURMAS E ALUNOS -->
            <section id="tab-turmas" class="tab-content space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Cadastrar/Editar Sala -->
                    <div class="bg-white p-5 rounded-xl shadow">
                        <h2 id="titulo-form-turma" class="text-lg font-semibold mb-4 text-indigo-600">Adicionar Nova Sala</h2>
                        <form id="form-turma" onsubmit="salvarTurma(event)" class="space-y-4">
                            <input type="hidden" id="turma-id-editando">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nome da Turma / Sala</label>
                                <input type="text" id="nome-turma" required placeholder="Ex: 8º Ano A" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="flex gap-2">
                                <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Salvar Turma</button>
                                <button type="button" id="btn-cancelar-edicao" onclick="cancelarEdicaoTurma()" class="hidden bg-slate-300 hover:bg-slate-400 text-slate-700 px-3 py-2 rounded-lg transition text-sm">Cancelar</button>
                            </div>
                        </form>
                    </div>

                    <!-- Cadastrar/Editar Alunos -->
                    <div class="bg-white p-5 rounded-xl shadow md:col-span-2">
                        <h2 id="titulo-form-aluno" class="text-lg font-semibold mb-4 text-indigo-600">Cadastrar Alunos na Sala</h2>
                        <form id="form-aluno" onsubmit="salvarAluno(event)" class="space-y-4">
                            <input type="hidden" id="aluno-id-editando">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Selecionar Sala</label>
                                    <select id="aluno-turma-select" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"></select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome do Aluno</label>
                                    <input type="text" id="nome-aluno" required placeholder="Nome completo" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button type="submit" id="btn-submit-aluno" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-6 py-2 rounded-lg transition">Adicionar Aluno</button>
                                <button type="button" id="btn-cancelar-edicao-aluno" onclick="cancelarEdicaoAluno()" class="hidden bg-slate-300 hover:bg-slate-400 text-slate-700 px-4 py-2 rounded-lg transition text-sm">Cancelar</button>
                            </div>
                        </form>

                        <div class="mt-6">
                            <h3 class="text-sm font-semibold text-slate-600 mb-2">Alunos na Turma Selecionada (Ordem Alfabética):</h3>
                            <div id="lista-alunos-container" class="max-h-48 overflow-y-auto border rounded-lg divide-y">
                                <p class="p-3 text-sm text-slate-400">Selecione uma turma para ver os alunos.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Listagem Geral de Turmas -->
                <div class="bg-white p-5 rounded-xl shadow">
                    <h2 class="text-lg font-semibold mb-4 text-indigo-600">Turmas Cadastradas</h2>
                    <div id="grid-turmas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </section>

            <!-- ABA 2: CRIAR PROVAS E GABARITO -->
            <section id="tab-provas" class="tab-content hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <h2 class="text-lg font-semibold mb-4 text-indigo-600">Criar Nova Prova & Gabarito Oficial</h2>
                    <form id="form-prova" onsubmit="salvarProva(event)" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nome da Prova</label>
                                <input type="text" id="prova-nome" required placeholder="Ex: Avaliação de Matemática" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Qtd. Questões</label>
                                <input type="number" id="prova-qtd-questoes" min="1" max="50" value="10" onchange="gerarCamposGabarito()" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div>
                                <label class="block
